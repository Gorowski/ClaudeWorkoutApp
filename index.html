<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Unit Call Sheet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap"><style id="css">
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --sunk:#F2EEE6; --ink:#191510; --muted:#6F6A60;
  --faint:#928C81; --rule:#E3DED2; --rule-hard:#C9C2B3;
  --accent:#A85A08; --accent-ink:#FFFFFF; --accent-soft:#FBEFD9;
  --flag:#A2402A; --flag-soft:#FBE9E4; --cool:#3B6172; --cool-soft:#E7EFF2;
  --ok:#3F6B45; --ok-soft:#E8F1E8;
  --shadow:0 1px 2px rgba(25,21,16,.05), 0 8px 24px -16px rgba(25,21,16,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131110; --surface:#1B1917; --sunk:#211E1B; --ink:#F1EDE5; --muted:#9B9488;
    --faint:#7B756A; --rule:#302B26; --rule-hard:#443D35;
    --accent:#F5A83C; --accent-ink:#1B1400; --accent-soft:#2B2116;
    --flag:#E58164; --flag-soft:#2E1D18; --cool:#84AFC1; --cool-soft:#1A2429;
    --ok:#7FB587; --ok-soft:#18231A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1B1917; --sunk:#211E1B; --ink:#F1EDE5; --muted:#9B9488;
  --faint:#7B756A; --rule:#302B26; --rule-hard:#443D35;
  --accent:#F5A83C; --accent-ink:#1B1400; --accent-soft:#2B2116;
  --flag:#E58164; --flag-soft:#2E1D18; --cool:#84AFC1; --cool-soft:#1A2429;
  --ok:#7FB587; --ok-soft:#18231A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 90px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.cond{font-family:"Saira Condensed",'Arial Narrow',sans-serif}

/* masthead */
.masthead{display:flex;align-items:flex-end;gap:10px;padding:18px 0 9px;border-bottom:2px solid var(--ink)}
.masthead h1{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:700;
  font-size:clamp(1.25rem,4.6vw,1.75rem);line-height:1.02;letter-spacing:.02em;
  text-transform:uppercase;margin:0;text-wrap:balance}
.masthead .sub{margin:0 0 3px}
#saveChip{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;padding:4px 8px;border-radius:2px;white-space:nowrap}
.chip.clean{background:var(--ok-soft);color:var(--ok)}
.chip.dirty{background:var(--accent-soft);color:var(--accent)}
.chip.busy{background:var(--cool-soft);color:var(--cool)}
.chip.err{background:var(--flag-soft);color:var(--flag)}
button.save{background:var(--accent);color:var(--accent-ink);border:none;border-radius:2px;
  padding:6px 12px;font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;
  font-size:.85rem;letter-spacing:.07em;text-transform:uppercase}
button.save[disabled]{opacity:.35;cursor:default}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--rule);
  margin:0 -14px;padding:0 14px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;
  font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;margin:8px 0;
  border:1px solid var(--rule-hard);border-radius:2px;background:var(--surface);color:var(--muted)}
.nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin:18px 0 14px}
.datebar .arrow{width:38px;height:38px;border:1px solid var(--rule-hard);border-radius:2px;
  background:var(--surface);color:var(--ink);font-size:1.1rem;line-height:1;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.datebar .arrow:hover{border-color:var(--ink)}
.datebar .d{flex:1;text-align:center;min-width:0}
.datebar .d strong{display:block;font-family:"Saira Condensed",'Arial Narrow',sans-serif;
  font-weight:700;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.datebar .today{flex:0 0 auto;background:none;border:1px solid var(--rule-hard);border-radius:2px;
  color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;
  letter-spacing:.11em;text-transform:uppercase;padding:9px 10px}
.datebar .today:hover{color:var(--ink);border-color:var(--ink)}
.datebar .today.hot{color:var(--accent);border-color:var(--accent)}

/* routine picker */
.pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:16px}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:0 0 auto;font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;
  font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;
  border:1px solid var(--rule-hard);border-radius:2px;background:var(--surface);color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick button.rest[aria-pressed="true"]{background:var(--faint);border-color:var(--faint);color:var(--bg)}

/* session head */
.shead{border:1px solid var(--rule-hard);border-radius:3px;background:var(--surface);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.shead .bar{padding:11px 15px;background:var(--ink);color:var(--bg);display:flex;
  justify-content:space-between;align-items:baseline;gap:10px}
.shead .bar h2{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:700;
  font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1.1}
.shead .bar span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.63rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.shead .body{padding:11px 15px;font-size:.87rem;color:var(--muted)}
.shead .body b{color:var(--accent);font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;display:block;font-weight:600}

/* exercise card */
.ex{border-bottom:1px solid var(--rule);padding:15px 2px}
.ex:first-child{border-top:1px solid var(--rule-hard)}
.ex-top{display:flex;align-items:baseline;gap:9px}
.ex-top .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:600;
  color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:3px}
.ex-top .nm{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;font-size:1.2rem;
  line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
.ex-top .tgt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;text-align:right}
.prev{margin:5px 0 0 27px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;
  color:var(--faint);font-variant-numeric:tabular-nums}
.prev b{color:var(--cool);font-weight:600}
.up{color:var(--ok);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 27px;align-items:center}
.setbox{display:flex;align-items:center;border:1px solid var(--rule-hard);border-radius:2px;
  background:var(--surface);overflow:hidden}
.setbox .si{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;color:var(--faint);
  padding:0 5px;background:var(--sunk);align-self:stretch;display:flex;align-items:center}
.setbox input{width:44px;border:none;background:transparent;color:var(--ink);padding:7px 3px;
  text-align:center;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;
  font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.setbox input::-webkit-outer-spin-button,.setbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setbox input.w{width:52px}
.setbox .x{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;color:var(--faint);padding:0 1px}
.setbox .u{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;color:var(--faint);padding-right:6px}
.setbox.filled{border-color:var(--accent)}
.mini{border:1px solid var(--rule-hard);background:var(--surface);color:var(--muted);border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 9px;line-height:1}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.mini.danger:hover{color:var(--flag);border-color:var(--flag)}
.cue{margin:9px 0 0 27px;font-size:.83rem;color:var(--muted);line-height:1.45}

/* notes */
textarea{width:100%;border:1px solid var(--rule-hard);border-radius:3px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.9rem;padding:11px 12px;resize:vertical;min-height:82px}
textarea::placeholder{color:var(--faint)}
.sect{margin-top:26px}
.sect > .lbl{display:block;margin-bottom:7px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.cal-head h3{flex:1;text-align:center;margin:0;font-family:"Saira Condensed",'Arial Narrow',sans-serif;
  font-weight:700;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .dow{text-align:center;padding:5px 0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cell{aspect-ratio:1;border:1px solid var(--rule);border-radius:2px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink);padding:2px;min-height:40px}
.cell.blank{border:none;background:none}
.cell .dn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.74rem;font-variant-numeric:tabular-nums}
.cell .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.46rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);line-height:1}
.cell.logged{background:var(--accent-soft);border-color:var(--accent)}
.cell.logged .tag{color:var(--accent)}
.cell.today{outline:2px solid var(--ink);outline-offset:-1px}
.cell.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cell.sel .tag{color:var(--bg);opacity:.8}
.cell.future{opacity:.5}
.recent{margin-top:22px}
.rrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:10px 4px;
  border:none;border-bottom:1px solid var(--rule);background:none;color:var(--ink)}
.rrow:hover{background:var(--sunk)}
.rrow .rd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;color:var(--muted);
  flex:0 0 auto;font-variant-numeric:tabular-nums;width:72px}
.rrow .rn{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;font-size:1.05rem;flex:1;min-width:0}
.rrow .rv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.64rem;color:var(--faint);flex:0 0 auto}

/* program editor */
.rt{border:1px solid var(--rule-hard);border-radius:3px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.rt > summary{padding:11px 14px;background:var(--sunk);cursor:pointer;display:flex;
  align-items:baseline;gap:10px;list-style:none}
.rt > summary::-webkit-details-marker{display:none}
.rt > summary h4{margin:0;font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;flex:1}
.rt > summary .c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;color:var(--faint)}
.rt .inner{padding:6px 12px 14px}
.pe{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.pe input[type=text]{width:100%;border:1px solid transparent;border-radius:2px;background:transparent;
  color:var(--ink);font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;
  font-size:1.08rem;padding:4px 5px}
.pe input[type=text]:focus{border-color:var(--rule-hard);background:var(--bg)}
.pe .btns{display:flex;gap:4px;align-items:flex-start}
.pe .btns button{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.nums{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nums label{display:flex;align-items:center;border:1px solid var(--rule-hard);border-radius:2px;overflow:hidden;background:var(--surface)}
.nums label span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.55rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding:0 6px;background:var(--sunk);align-self:stretch;
  display:flex;align-items:center}
.nums input{width:52px;border:none;background:transparent;color:var(--ink);padding:6px 3px;text-align:center;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.82rem;font-weight:600;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.nums input::-webkit-outer-spin-button,.nums input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pe .cin{grid-column:1/3}
.pe .cin input{width:100%;border:1px solid transparent;border-radius:2px;background:transparent;
  color:var(--muted);font:inherit;font-size:.82rem;padding:4px 5px}
.pe .cin input:focus{border-color:var(--rule-hard);background:var(--bg);color:var(--ink)}
.sched{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;
  border:1px solid var(--rule-hard);border-radius:3px;padding:12px 14px;background:var(--surface)}
select{width:100%;border:1px solid var(--rule-hard);border-radius:2px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.88rem;padding:6px 8px}

/* reference */
.ref h3{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:700;font-size:1.3rem;
  letter-spacing:.05em;text-transform:uppercase;margin:0 0 2px}
.ref .lede{color:var(--muted);font-size:.88rem;margin:0 0 14px;max-width:62ch}
.ref-hr{border:none;border-top:2px solid var(--ink);margin:0 0 13px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.rules li{background:var(--surface);padding:11px 14px;display:grid;grid-template-columns:auto 1fr;
  gap:11px;align-items:start;font-size:.88rem}
.rules .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);padding-top:4px;min-width:70px}
.scrollx{overflow-x:auto}
.vol{width:100%;border-collapse:collapse;font-size:.86rem}
.vol th,.vol td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left}
.vol th{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);font-weight:500;border-bottom:1px solid var(--rule-hard)}
.vol td.n{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.vol td.was{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--faint)}
.vol tr.gain td.n{color:var(--accent)}
.fb{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fb-card{border:1px solid var(--rule-hard);border-radius:3px;background:var(--surface);overflow:hidden}
.fb-card h4{margin:0;padding:8px 13px;background:var(--cool);color:var(--bg);
  font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:600;font-size:1.05rem;
  letter-spacing:.06em;text-transform:uppercase}
.fb-card ol{margin:0;padding:9px 13px 12px 28px;font-size:.85rem}
.fb-card li{padding:3px 0}
.fb-card li span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.75rem;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.note{margin-top:12px;padding:11px 13px;border-left:3px solid var(--flag);background:var(--flag-soft);
  border-radius:0 3px 3px 0;font-size:.84rem}
.note .h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--flag);display:block;margin-bottom:2px;font-weight:600}
.empty{text-align:center;padding:34px 20px;border:1px dashed var(--rule-hard);border-radius:3px;
  background:var(--surface);color:var(--muted);font-size:.9rem}
.empty h2{font-family:"Saira Condensed",'Arial Narrow',sans-serif;font-weight:700;font-size:2.1rem;
  letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--faint)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}

"sets":3,"lo":12,"hi":20,"load":90,"cue":"Lighter, higher rep than Monday. Still pause the bottom."}]},"pushB":{"id":"pushB","name":"Push B","focus":"Incline & delts","cardio":"45 min incline walk","warmup":"Bar × 15, then 40 kg × 8 and 50 kg × 4.","ex":[{"id":"pushB_e1","name":"Incline Barbell Press","sets":2,"lo":8,"hi":10,"load":60,"cue":"The lighter of your two press days — deliberately. Twice-weekly heavy benching is what breaks shoulders."},{"id":"pushB_e2","name":"Flat DB Press","sets":2,"lo":10,"hi":12,"load":30,"cue":"Per hand."},{"id":"pushB_e3","name":"Pec Deck","sets":2,"lo":12,"hi":15,"load":40,"cue":"Lengthened partials after failure on set 2."},{"id":"pushB_e4","name":"Lateral Raise","sets":3,"lo":12,"hi":20,"load":7.5,"cue":"Per hand."},{"id":"pushB_e5","name":"Overhead Cable Triceps Ext","sets":2,"lo":10,"hi":15,"load":30,"cue":"Overhead hits the long head — Tuesday's pushdowns don't."},{"id":"pushB_e6","name":"Cable Crunch","sets":2,"lo":12,"hi":15,"load":43.75,"cue":""}]},"pullB":{"id":"pullB","name":"Pull B","focus":"Vertical & arms","cardio":"45 min incline walk","warmup":"Two light lat pulldown sets to get the shoulders moving before you hang.","ex":[{"id":"pullB_e1","name":"Reverse-Grip Pull-Up","sets":2,"lo":6,"hi":10,"load":0,"cue":"Bodyweight — log added weight only. Add weight once you clear 10."},{"id":"pullB_e2","name":"Single-Arm Cable Lat Pulldown","sets":2,"lo":10,"hi":12,"load":41.25,"cue":"Per side. Let the shoulder travel all the way up at the top."},{"id":"pullB_e3","name":"Seated Cable Row","sets":2,"lo":10,"hi":12,"load":80,"cue":"Wider grip than Wednesday's — different angle, same muscle."},{"id":"pullB_e4","name":"Straight-Arm Rope Pulldown","sets":2,"lo":12,"hi":15,"load":37,"cue":"Cut from three sets and moved off the front of the session."},{"id":"pullB_e5","name":"Reverse Pec Deck","sets":3,"lo":15,"hi":20,"load":20,"cue":"Second rear-delt hit of the week."},{"id":"pullB_e6","name":"Hammer Curl","sets":2,"lo":10,"hi":12,"l (function(){
"use strict";

var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">';
var LS='nucs.state.v2', LSUI='nucs.ui.v2';
var app=document.getElementById('app');

/* ---------- state ---------- */
var S;
try{ S=JSON.parse(document.getElementById('state').textContent); }catch(e){ S={v:2,rev:0,routines:{},order:[],schedule:{},log:{}}; }
try{
  var local=JSON.parse(localStorage.getItem(LS)||'null');
  if(local && local.rev>(S.rev||0)) S=local;
}catch(e){}
if(!S.log) S.log={};

var ui={tab:'session',date:todayKey(),cal:null};
try{ var u=JSON.parse(sessionStorage.getItem(LSUI)||'null'); if(u) ui=Object.assign(ui,u); }catch(e){}
if(!ui.cal) ui.cal=ui.date.slice(0,7);

var dirty=false, saving=false, readOnly=false, lastErr='', artifact=null, idle=null;

/* ---------- dates ---------- */
function pad(n){ return (n<10?'0':'')+n; }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function shift(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function longDate(k){ var d=parseKey(k); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3); }
function shortDate(k){ var d=parseKey(k); return DOW[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(v){ if(v===''||v==null) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
function fmt(n){ if(n==null||n==='') return ''; return (Math.round(n*100)/100)+''; }
function rid(){ return 'x'+Math.random().toString(36).slice(2,8); }

/* build a session for a date, from the log if present, else from the schedule */
function sessionFor(k){
  var e=S.log[k];
  if(e) return e;
  var d=parseKey(k), rk=S.schedule[String(d.getDay())]||'';
  return {routine:rk,notes:'',ex:[],draft:true};
}
function commit(k){
  if(!S.log[k]){ var s=sessionFor(k); delete s.draft; S.log[k]=s; }
  return S.log[k];
}
function exState(sess,tpl){
  var found=null;
  for(var i=0;i<(sess.ex||[]).length;i++){ if(sess.ex[i].id===tpl.id) { found=sess.ex[i]; break; } }
  return found;
}
/* is k the most recent day that has any logged reps? */
function isLatest(k){
  var keys=Object.keys(S.log);
  for(var i=0;i<keys.length;i++){
    if(keys[i]<=k) continue;
    var e=S.log[keys[i]];
    if(e&&e.ex&&e.ex.some(function(x){ return x.sets&&x.sets.some(function(s){ return s.r!=null; }); })) return false;
  }
  return true;
}
/* most recent logged performance of this exercise before date k */
function lastTime(k,rk,exId,name){
  var keys=Object.keys(S.log).filter(function(d){ return d<k; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var e=S.log[keys[i]]; if(!e||!e.ex) continue;
    for(var j=0;j<e.ex.length;j++){
      var x=e.ex[j];
      var match=(e.routine===rk && x.id===exId) || (x.name && name && x.name.toLowerCase()===name.toLowerCase());
      if(match && x.sets && x.sets.some(function(st){ return st.r!=null; })) return {date:keys[i],sets:x.sets};
    }
  }
  return null;
}

/* ---------- persistence ---------- */
function mirror(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function touch(){ S.rev=(S.rev||0)+1; dirty=true; lastErr=''; mirror(); armIdle(); paintChip(); }
function armIdle(){ clearTimeout(idle); idle=setTimeout(function(){ save(); },60000); }

function buildDoc(){
  var css=document.getElementById('css').textContent;
  var js=document.getElementById('app-js').textContent;
  var data=JSON.stringify(S).replace(/</g,'\\u003c');
  var st='<'+'script id="state" type="application/json">'+data+'<'+'/script>';
  var ap='<'+'script id="app-js">'+js+'<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Night Unit Call Sheet</title>'+FONTS+
    '<style id="css">'+css+'</style></head><body>'+
    '<div class="wrap"><div id="app"></div></div>'+st+ap+'</body></html>';
}

function save(){
  if(!dirty||saving||readOnly) return;
  if(!artifact){ return; }
  saving=true; paintChip();
  try{ sessionStorage.setItem(LSUI,JSON.stringify({tab:ui.tab,date:ui.date,cal:ui.cal,y:window.scrollY})); }catch(e){}
  artifact.publish(buildDoc()).then(function(){
    dirty=false; saving=false; paintChip();
  },function(err){
    saving=false;
    var c=err&&err.code;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'||c==='consent_required'){
      readOnly=true; lastErr='Read-only here — saved on this device only';
    } else if(c==='conflict'){
      lastErr='';
    } else if(c==='rate_limited'){
      lastErr='Saving too fast — will retry';
      setTimeout(function(){ save(); },8000);
    } else if(c==='too_large'){
      lastErr='Log too large to save';
    } else {
      lastErr='Save failed — kept on this device';
    }
    paintChip();
  });
}

/* ---------- chip ---------- */
function paintChip(){
  var el=document.getElementById('saveChip'); if(!el) return;
  var cls='clean', txt='Saved';
  if(saving){ cls='busy'; txt='Saving'; }
  else if(lastErr){ cls='err'; txt=lastErr; }
  else if(readOnly){ cls='err'; txt='This device only'; }
  else if(dirty){ cls='dirty'; txt='Unsaved'; }
  el.innerHTML='<span class="chip '+cls+'">'+esc(txt)+'</span>'+
    (readOnly?'':'<button class="save" data-act="save"'+(dirty&&!saving?'':' disabled')+'>Save</button>');
}

/* ---------- render ---------- */
function render(){
  var h='';
  h+='<header class="masthead"><div><p class="sub lbl">Gold Coast Unit · Nights</p>'+
     '<h1>Night Unit Call Sheet</h1></div><div id="saveChip"></div></header>';
  h+='<nav class="nav">';
  [['session','Session'],['calendar','Calendar'],['program','Program'],['reference','Reference']].forEach(function(t){
    h+='<button data-act="tab" data-v="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';
  });
  h+='</nav>';
  if(ui.tab==='session') h+=viewSession();
  else if(ui.tab==='calendar') h+=viewCalendar();
  else if(ui.tab==='program') h+=viewProgram();
  else h+=viewReference();
  var nlog=Object.keys(S.log).filter(function(k){
    var e=S.log[k]; return e&&e.ex&&e.ex.some(function(x){ return x.sets&&x.sets.some(function(s){ return s.r!=null; }); });
  }).length;
  h+='<footer><span>Rev. B · '+nlog+' session'+(nlog===1?'':'s')+' logged</span>'+
     '<span>Loads carry forward automatically</span></footer>';
  app.innerHTML=h;
  paintChip();
}

function viewSession(){
  var k=ui.date, sess=sessionFor(k), rk=sess.routine, r=S.routines[rk];
  var h='<div class="datebar">'+
    '<button class="arrow" data-act="day" data-v="-1" aria-label="Previous day">‹</button>'+
    '<div class="d"><span class="lbl">'+(k===todayKey()?'Today':'Session')+'</span><strong>'+esc(longDate(k))+'</strong></div>'+
    '<button class="arrow" data-act="day" data-v="1" aria-label="Next day">›</button>'+
    '<button class="today'+(k!==todayKey()?' hot':'')+'" data-act="today">Today</button></div>';

  h+='<div class="pick">';
  S.order.forEach(function(id){
    h+='<button data-act="setr" data-v="'+id+'" aria-pressed="'+(rk===id)+'">'+esc(S.routines[id].name)+'</button>';
  });
  h+='<button class="rest" data-act="setr" data-v="" aria-pressed="'+(!rk)+'">Rest</button></div>';

  if(!r){
    h+='<div class="empty"><h2>Rest</h2><p>Nothing scheduled. Pick a session above if you\'re training today — two hard sets per exercise only builds anything if the recovery underneath it is real.</p></div>';
    h+=notesBlock(sess);
    return h;
  }

  var count=0; r.ex.forEach(function(x){ count+=x.sets; });
  h+='<div class="shead"><div class="bar"><h2>'+esc(r.name)+' · '+esc(r.focus)+'</h2>'+
      '<span>'+count+' sets</span></div>';
  if(r.warmup) h+='<div class="body"><b>Warm-up — not counted</b>'+esc(r.warmup)+'</div>';
  h+='</div>';

  r.ex.forEach(function(tpl,i){
    var st=exState(sess,tpl);
    var sets=(st&&st.sets)?st.sets:[];
    var prev=lastTime(k,rk,tpl.id,tpl.name);
    h+='<div class="ex" data-ex="'+tpl.id+'">';
    h+='<div class="ex-top"><span class="n">'+(i<9?'0':'')+(i+1)+'</span>'+
       '<span class="nm">'+esc(tpl.name)+'</span>'+
       '<span class="tgt">'+tpl.sets+' × '+tpl.lo+'–'+tpl.hi+'<br>'+(tpl.load?fmt(tpl.load)+' kg':'BW')+'</span></div>';
    if(prev){
      var best=prev.sets.filter(function(s){return s.r!=null;}).map(function(s){ return s.r+'×'+(s.w?fmt(s.w):'BW'); }).join('  ');
      h+='<div class="prev">Last '+esc(shortDate(prev.date))+' — <b>'+esc(best)+'</b></div>';
    }
    h+='<div class="sets">';
    var n=(st&&st.sets&&st.sets.length)?st.sets.length:tpl.sets;
    for(var j=0;j<n;j++){
      var s=sets[j]||{};
      var filled=(s.r!=null&&s.r!=='');
      h+='<span class="setbox'+(filled?' filled':'')+'">'+
         '<span class="si">'+(j+1)+'</span>'+
         '<input type="number" inputmode="numeric" step="1" min="0" placeholder="'+tpl.lo+'" value="'+(s.r!=null?esc(s.r):'')+'" data-f="r" data-i="'+j+'" aria-label="Set '+(j+1)+' reps">'+
         '<span class="x">×</span>'+
         '<input class="w" type="number" inputmode="decimal" step="0.25" min="0" placeholder="'+(tpl.load?fmt(tpl.load):'0')+'" value="'+(s.w!=null?esc(fmt(s.w)):'')+'" data-f="w" data-i="'+j+'" aria-label="Set '+(j+1)+' weight">'+
         '<span class="u">kg</span></span>';
    }
    h+='<button class="mini" data-act="addset">+ set</button>';
    if(n>1) h+='<button class="mini danger" data-act="delset">−</button>';
    h+='</div>';
    if(tpl.cue) h+='<div class="cue">'+esc(tpl.cue)+'</div>';
    h+='</div>';
  });

  if(r.cardio) h+='<div class="sect"><span class="lbl">After the session</span><div class="shead"><div class="body" style="color:var(--cool)">'+esc(r.cardio)+'</div></div></div>';
  h+=notesBlock(sess);
  return h;
}

function notesBlock(sess){
  return '<div class="sect"><span class="lbl">Session notes</span>'+
    '<textarea data-act="notes" placeholder="How it felt, what to change, anything that got in the way.">'+esc(sess.notes||'')+'</textarea></div>';
}

function viewCalendar(){
  var ym=ui.cal, y=+ym.slice(0,4), m=+ym.slice(5,7)-1;
  var first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
  var h='<div class="cal-head">'+
    '<button class="arrow" data-act="mon" data-v="-1" aria-label="Previous month">‹</button>'+
    '<h3>'+MON[m]+' '+y+'</h3>'+
    '<button class="arrow" data-act="mon" data-v="1" aria-label="Next month">›</button></div>';
  h+='<div class="grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d,i){ h+='<div class="dow">'+d+'</div>'; });
  for(var b=0;b<start;b++) h+='<div class="cell blank"></div>';
  var tk=todayKey();
  for(var d=1;d<=days;d++){
    var k=y+'-'+pad(m+1)+'-'+pad(d);
    var e=S.log[k];
    var logged=!!(e&&e.ex&&e.ex.some(function(x){ return x.sets&&x.sets.some(function(s){return s.r!=null;}); }));
    var rk=e?e.routine:(S.schedule[String(new Date(y,m,d).getDay())]||'');
    var nm=rk&&S.routines[rk]?S.routines[rk].name:'';
    var cls='cell'+(logged?' logged':'')+(k===tk?' today':'')+(k===ui.date?' sel':'')+(k>tk?' future':'');
    h+='<button class="'+cls+'" data-act="pick" data-v="'+k+'"><span class="dn">'+d+'</span>'+
       '<span class="tag">'+esc(nm.replace(/ /g,''))+'</span></button>';
  }
  h+='</div>';

  var keys=Object.keys(S.log).sort().reverse().filter(function(k){
    var e=S.log[k]; return e&&((e.ex&&e.ex.some(function(x){return x.sets&&x.sets.some(function(s){return s.r!=null;});}))||e.notes);
  });
  h+='<div class="recent"><span class="lbl">Logged sessions</span>';
  if(!keys.length) h+='<div class="empty" style="margin-top:8px">Nothing logged yet. Open a day, type your reps and weights, and it lands here.</div>';
  keys.slice(0,40).forEach(function(k){
    var e=S.log[k], r=S.routines[e.routine], sets=0, vol=0;
    (e.ex||[]).forEach(function(x){ (x.sets||[]).forEach(function(s){ if(s.r!=null){ sets++; vol+=(s.r*(s.w||0)); } }); });
    h+='<button class="rrow" data-act="pick" data-v="'+k+'">'+
       '<span class="rd">'+esc(shortDate(k))+'</span>'+
       '<span class="rn">'+esc(r?r.name:'Rest')+'</span>'+
       '<span class="rv">'+sets+' sets · '+Math.round(vol)+' kg</span></button>';
  });
  h+='</div>';
  return h;
}

function viewProgram(){
  var h='<p class="lede" style="margin:18px 0 14px;color:var(--muted);font-size:.88rem">Edit the program itself — rename lifts, change targets, reorder, add or remove. Weights here update themselves as you log heavier, so you usually won\'t need to touch the load field.</p>';
  S.order.forEach(function(id){
    var r=S.routines[id]; var n=0; r.ex.forEach(function(x){ n+=x.sets; });
    h+='<details class="rt" data-rt="'+id+'"><summary><h4>'+esc(r.name)+'</h4>'+
       '<span class="c">'+esc(r.focus)+' · '+n+' sets</span></summary><div class="inner">';
    r.ex.forEach(function(x,i){
      h+='<div class="pe" data-ei="'+i+'">'+
        '<input type="text" value="'+esc(x.name)+'" data-p="name" aria-label="Exercise name">'+
        '<span class="btns">'+
          '<button class="mini" data-act="mv" data-v="-1"'+(i===0?' disabled':'')+' aria-label="Move up">↑</button>'+
          '<button class="mini" data-act="mv" data-v="1"'+(i===r.ex.length-1?' disabled':'')+' aria-label="Move down">↓</button>'+
          '<button class="mini danger" data-act="rmex" aria-label="Remove">✕</button>'+
        '</span>'+
        '<span class="nums">'+
          '<label><span>Sets</span><input type="number" min="1" max="10" step="1" value="'+x.sets+'" data-p="sets"></label>'+
          '<label><span>Reps</span><input type="number" min="1" step="1" value="'+x.lo+'" data-p="lo"></label>'+
          '<label><span>to</span><input type="number" min="1" step="1" value="'+x.hi+'" data-p="hi"></label>'+
          '<label><span>kg</span><input type="number" min="0" step="0.25" value="'+fmt(x.load)+'" data-p="load"></label>'+
        '</span>'+
        '<span class="cin"><input type="text" value="'+esc(x.cue||'')+'" data-p="cue" placeholder="Cue or note" aria-label="Cue"></span>'+
      '</div>';
    });
    h+='<div style="padding-top:12px"><button class="mini" data-act="addex">+ Add exercise</button></div>';
    h+='</div></details>';
  });

  h+='<div class="sect"><span class="lbl">Default week</span><div class="sched">';
  [1,2,3,4,5,6,0].forEach(function(d){
    h+='<span class="lbl" style="padding-top:7px">'+DOW[d].slice(0,3)+'</span><select data-act="sched" data-v="'+d+'">';
    h+='<option value=""'+(!S.schedule[String(d)]?' selected':'')+'>Rest</option>';
    S.order.forEach(function(id){
      h+='<option value="'+id+'"'+(S.schedule[String(d)]===id?' selected':'')+'>'+esc(S.routines[id].name)+'</option>';
    });
    h+='</select>';
  });
  h+='</div><p style="font-size:.82rem;color:var(--muted);margin-top:9px">This is only the default. Any single day can be switched to any session from the Session tab without changing the week.</p></div>';
  return h;
}

/* ---------- interaction ---------- */
function exIndexOf(el){
  var card=el.closest('.ex'); if(!card) return null;
  return card.getAttribute('data-ex');
}

app.addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b) return;
  var act=b.getAttribute('data-act'), v=b.getAttribute('data-v');

  if(act==='tab'){ flushIfLeaving(); ui.tab=v; render(); window.scrollTo(0,0); return; }
  if(act==='save'){ save(); return; }
  if(act==='day'){ flushIfLeaving(); ui.date=shift(ui.date,+v); ui.cal=ui.date.slice(0,7); render(); return; }
  if(act==='today'){ flushIfLeaving(); ui.date=todayKey(); ui.cal=ui.date.slice(0,7); render(); return; }
  if(act==='mon'){
    var y=+ui.cal.slice(0,4), m=+ui.cal.slice(5,7)-1+(+v);
    var d=new Date(y,m,1); ui.cal=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); return;
  }
  if(act==='pick'){ flushIfLeaving(); ui.date=v; ui.cal=v.slice(0,7); ui.tab='session'; render(); window.scrollTo(0,0); return; }

  if(act==='setr'){
    var s=commit(ui.date);
    s.routine=v;                     /* keep any logged sets — ids are routine-scoped */
    touch(); render(); return;
  }
  if(act==='addset'||act==='delset'){
    var id=exIndexOf(b); if(!id) return;
    var sess=commit(ui.date), r=S.routines[sess.routine]; if(!r) return;
    var tpl=null; r.ex.forEach(function(x){ if(x.id===id) tpl=x; });
    if(!tpl) return;
    var st=exState(sess,tpl);
    if(!st){ st={id:tpl.id,name:tpl.name,sets:[]}; sess.ex.push(st); }
    while(st.sets.length<tpl.sets) st.sets.push({r:null,w:null});
    if(act==='addset') st.sets.push({r:null,w:null});
    else if(st.sets.length>1) st.sets.pop();
    touch(); render(); return;
  }
  if(act==='mv'||act==='rmex'||act==='addex'){
    var det=b.closest('.rt'); if(!det) return;
    var r=S.routines[det.getAttribute('data-rt')];
    if(act==='addex'){
      r.ex.push({id:rid(),name:'New exercise',sets:2,lo:8,hi:12,load:0,cue:''});
    } else {
      var row=b.closest('.pe'), i=+row.getAttribute('data-ei');
      if(act==='rmex') r.ex.splice(i,1);
      else { var j=i+(+v); if(j>=0&&j<r.ex.length){ var t=r.ex[i]; r.ex[i]=r.ex[j]; r.ex[j]=t; } }
    }
    touch();
    var openIds=[].slice.call(app.querySelectorAll('.rt[open]')).map(function(d){return d.getAttribute('data-rt');});
    render();
    openIds.forEach(function(id){ var d=app.querySelector('.rt[data-rt="'+id+'"]'); if(d) d.open=true; });
    return;
  }
});

app.addEventListener('input',function(ev){
  var el=ev.target;

  /* session set entry */
  if(el.matches('.setbox input')){
    var id=exIndexOf(el); if(!id) return;
    var sess=commit(ui.date), r=S.routines[sess.routine]; if(!r) return;
    var tpl=null; r.ex.forEach(function(x){ if(x.id===id) tpl=x; });
    if(!tpl) return;
    var st=exState(sess,tpl);
    if(!st){ st={id:tpl.id,name:tpl.name,sets:[]}; sess.ex.push(st); }
    var i=+el.getAttribute('data-i'), need=Math.max(tpl.sets,i+1);
    while(st.sets.length<need) st.sets.push({r:null,w:null});
    st.sets[i][el.getAttribute('data-f')]=num(el.value);
    st.name=tpl.name;
    el.closest('.setbox').classList.toggle('filled', st.sets[i].r!=null);
    /* carry the heaviest logged weight forward — but only when editing the
       latest session, so fixing up an old day doesn't rewrite today's target */
    if(isLatest(ui.date)){
      var hi=null; st.sets.forEach(function(s){ if(s.w!=null&&(hi==null||s.w>hi)) hi=s.w; });
      if(hi!=null&&hi>0) tpl.load=hi;
    }
    touch();
    return;
  }

  /* notes */
  if(el.matches('textarea[data-act="notes"]')){
    commit(ui.date).notes=el.value; touch(); return;
  }

  /* program editor */
  if(el.matches('.pe input')){
    var det=el.closest('.rt'), row=el.closest('.pe');
    var r=S.routines[det.getAttribute('data-rt')], x=r.ex[+row.getAttribute('data-ei')];
    var p=el.getAttribute('data-p');
    if(p==='name'||p==='cue') x[p]=el.value;
    else { var n=num(el.value); if(n!=null) x[p]=(p==='load'?n:Math.max(1,Math.round(n))); }
    touch(); return;
  }
});

app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.matches('select[data-act="sched"]')){
    S.schedule[el.getAttribute('data-v')]=el.value; touch();
    return;
  }
});

function flushIfLeaving(){ if(dirty) save(); }
document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });
window.addEventListener('pagehide',function(){ mirror(); });

/* ---------- boot ---------- */
render();
if(ui.y){ var y=ui.y; ui.y=0; setTimeout(function(){ window.scrollTo(0,y); },30); }

if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){
    artifact=a;
    if(!a){ readOnly=true; }
    paintChip();
  },function(){ readOnly=true; paintChip(); });
} else { readOnly=true; paintChip(); }

})();
</script></body></html>
